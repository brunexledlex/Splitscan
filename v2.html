<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slitscan">
<title>Slitscan v2</title>
<style>
/* ── Material Design 3, dark, amber source ────────────────────────────
   Committed dark: a viewfinder that turns white wrecks your judgement
   of the image. Every colour painted explicitly.                      */
:root{
  --surface:#14100C;
  --s-container:#201B16;
  --s-container-hi:#2B241E;
  --s-container-highest:#372F27;
  --on-surface:#EDE0D4;
  --on-surface-var:#D5C6B4;
  --outline:#9C8F80;
  --outline-var:#4E453B;
  --primary:#FFB868;          /* M3 dark primary — lighter tone of the source */
  --on-primary:#4A2800;
  --p-container:#6B3B00;
  --on-p-container:#FFDDB8;
  --error:#FFB4AB;
  --scrim:rgba(0,0,0,.55);

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;

  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);

  --ease:cubic-bezier(.2,0,0,1);          /* M3 emphasised */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--surface); color:var(--on-surface);
  font-family:var(--sans); font-size:15px;
  -webkit-user-select:none; user-select:none;
  height:100dvh; position:relative;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none !important}

/* ── viewport: the product. Full bleed, nothing letterboxed ───────── */
#viewport{position:fixed;inset:0;touch-action:none;background:#000}
#viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}

/* ── floating chrome ──────────────────────────────────────────────── */
#topbar{
  position:fixed;left:0;right:0;top:0;z-index:3;
  padding:calc(var(--safe-t) + 8px) 10px 8px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(rgba(20,16,12,.62), rgba(20,16,12,0));
  pointer-events:none;
}
#topbar > *{pointer-events:auto}
#readout{
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--on-surface-var);letter-spacing:.02em;
  padding:6px 10px;border-radius:999px;background:rgba(32,27,22,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#readout b{color:var(--primary);font-weight:500}
.spacer{flex:1;pointer-events:none !important}

/* M3 icon button — 48dp target, 40dp visual */
.icon-btn{
  width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;
  border-radius:50%;color:var(--on-surface);
  background:rgba(32,27,22,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(156,143,128,.22);
  transition:background .15s var(--ease),transform .12s var(--ease);
}
.icon-btn:active{transform:scale(.92);background:var(--s-container-hi)}
.icon-btn[aria-pressed="true"]{background:var(--p-container);color:var(--on-p-container)}
.icon-btn svg{width:24px;height:24px;fill:currentColor;display:block}
.icon-btn:disabled{opacity:.38}

/* ── dock: the residue. Three targets, no bar ─────────────────────── */
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:3;
  padding:0 24px calc(var(--safe-b) + 18px);
  display:flex;align-items:center;justify-content:center;gap:34px;
  background:linear-gradient(rgba(20,16,12,0), rgba(20,16,12,.62));
  pointer-events:none;
}
#dock > *{pointer-events:auto}

#shutter{
  width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
  background:var(--primary);color:var(--on-primary);
  border:0;box-shadow:0 3px 14px rgba(0,0,0,.45);
  transition:transform .12s var(--ease),background .18s var(--ease);
}
#shutter:active{transform:scale(.92)}
#shutter svg{width:34px;height:34px;fill:currentColor}
#shutter.recording{background:var(--error);color:#3B0906}

/* ── M3 bottom sheet ──────────────────────────────────────────────── */
#scrim{
  position:fixed;inset:0;z-index:4;background:var(--scrim);
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:var(--s-container);color:var(--on-surface);
  border-radius:28px 28px 0 0;
  padding:0 16px calc(var(--safe-b) + 16px);
  transform:translateY(101%);transition:transform .28s var(--ease);
  max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 -2px 24px rgba(0,0,0,.5);
}
.sheet.on{transform:translateY(0)}
.grabber{width:32px;height:4px;border-radius:2px;background:var(--outline-var);
  margin:12px auto 4px}
.sheet h2{font-size:16px;font-weight:600;margin:12px 0 2px}
.sheet .hint{font-size:12px;color:var(--on-surface-var);margin:0 0 10px}
.group{margin:14px 0}
.group > .label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--on-surface-var);margin-bottom:8px;display:flex;gap:8px;align-items:baseline;
}
.group > .label output{
  margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;
  color:var(--primary);letter-spacing:0;text-transform:none;font-size:12px;
}

/* M3 segmented button */
.seg{display:flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden}
.seg button{
  flex:1;min-height:48px;padding:0 8px;font-size:13px;font-weight:500;
  color:var(--on-surface);border-right:1px solid var(--outline);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--p-container);color:var(--on-p-container)}

/* M3 filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:48px;padding:0 16px;border-radius:8px;
  border:1px solid var(--outline);font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;color:var(--on-surface);
}
.chip[aria-pressed="true"]{background:var(--p-container);color:var(--on-p-container);border-color:transparent}
.chip svg{width:18px;height:18px;fill:currentColor}

/* M3 list rows for the export sheet */
.row{
  display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 4px;
  border-radius:12px;width:100%;text-align:left;
}
.row:active{background:var(--s-container-hi)}
.row .ico{width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  background:var(--s-container-highest);display:grid;place-items:center}
.row .ico svg{width:22px;height:22px;fill:var(--primary)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:15px;font-weight:500}
.row .txt span{display:block;font-size:12px;color:var(--on-surface-var);
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.row:disabled{opacity:.38}

.actions{display:flex;gap:10px;margin:16px 0 4px}
.btn{
  flex:1;min-height:48px;border-radius:999px;font-size:14px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--outline);color:var(--on-surface);
}
.btn.filled{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn svg{width:20px;height:20px;fill:currentColor}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:48px;background:none;
  margin:0;touch-action:none;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--outline-var)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;
  background:var(--primary);border:0;
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--outline-var)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);border:0}

/* M3 snackbar */
#snack{
  position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 108px);z-index:6;
  background:var(--s-container-highest);color:var(--on-surface);
  border-radius:8px;padding:14px 16px;font-size:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
#snack.on{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* the source video: on-screen so iOS keeps decoding, but invisible */
#vid{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;
  pointer-events:none;z-index:-1}
</style>
</head>
<body>

<div id="viewport">
  <canvas id="acc"></canvas>
  <canvas id="hud"></canvas>
</div>

<div id="topbar">
  <div id="readout">RADIAL · <b id="rAngle">000°</b></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnFlip" aria-label="Switch camera"></button>
  <button class="icon-btn" id="btnTune" aria-label="Settings"></button>
</div>

<div id="dock">
  <button class="icon-btn" id="btnSource" aria-label="Choose source"></button>
  <button id="shutter" aria-label="Start scan"></button>
  <button class="icon-btn" id="btnExport" aria-label="Export" disabled></button>
</div>

<div id="scrim"></div>

<!-- settings: also the accessibility twin for every on-canvas gesture -->
<div class="sheet" id="sheetTune" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="grabber"></div>
  <h2>Scan</h2>
  <p class="hint">Drag anywhere on the image to aim the slit by hand.</p>

  <div class="group">
    <div class="label"><span>Geometry</span></div>
    <div class="seg" id="segMode" role="group" aria-label="Geometry">
      <button data-mode="sweep">Sweep</button>
      <button data-mode="radial" aria-pressed="true">Radial</button>
      <button data-mode="strip">Strip</button>
    </div>
  </div>

  <div class="group">
    <div class="label"><span>Angle</span><output id="oAngle">0°</output></div>
    <div class="chips" id="chipsSnap" role="group" aria-label="Angle snap">
      <button class="chip" data-snap="0">0° horizontal</button>
      <button class="chip" data-snap="45">45°</button>
      <button class="chip" data-snap="90">90° vertical</button>
      <button class="chip" data-snap="free" aria-pressed="true">Free</button>
      <button class="chip" id="chipReverse">Reverse</button>
    </div>
    <input type="range" id="sAngle" min="0" max="360" step="1" value="0" aria-label="Slit angle">
  </div>

  <div class="group">
    <div class="label"><span id="lSlice">Slice</span><output id="oSlice">2 px</output></div>
    <div class="seg" id="segSlice" role="group" aria-label="Slice thickness">
      <button data-slice="1">1</button>
      <button data-slice="2" aria-pressed="true">2</button>
      <button data-slice="4">4</button>
      <button data-slice="8">8</button>
      <button data-slice="16">16</button>
    </div>
  </div>

  <div class="group" id="grpBlades">
    <div class="label"><span>Blades</span></div>
    <div class="seg" id="segBlades" role="group" aria-label="Blades">
      <button data-blades="1" aria-pressed="true">1</button>
      <button data-blades="2">2</button>
      <button data-blades="3">3</button>
      <button data-blades="4">4</button>
    </div>
  </div>

  <button class="chip" id="btnAdvanced" aria-expanded="false"
    style="width:100%;justify-content:center">Advanced</button>

  <div id="advanced" hidden>
    <div class="group">
      <div class="label"><span>Slice — full range</span><output id="oSliceFine">2</output></div>
      <input type="range" id="sSlice" min="1" max="60" step="1" value="2" aria-label="Slice thickness fine">
    </div>
    <div class="group">
      <div class="label"><span>Guides</span></div>
      <div class="seg" id="segGuides" role="group" aria-label="Guides">
        <button data-guides="on" aria-pressed="true">Shown</button>
        <button data-guides="off">Hidden</button>
      </div>
    </div>
    <div class="group">
      <div class="label"><span>Pivot</span></div>
      <button class="chip" id="btnRecentre" style="width:100%;justify-content:center">Recentre pivot</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn filled" id="tuneDone">Done</button>
  </div>
</div>

<!-- export -->
<div class="sheet" id="sheetExport" role="dialog" aria-modal="true" aria-label="Export">
  <div class="grabber"></div>
  <h2>Export</h2>
  <p class="hint" id="exportHint">Nothing scanned yet.</p>

  <button class="row" id="optHD">
    <span class="ico" id="icoHD"></span>
    <span class="txt"><b>HD still</b><span>1920 × 1080</span></span>
  </button>
  <button class="row" id="optStrip">
    <span class="ico" id="icoStrip"></span>
    <span class="txt"><b>Continuous strip</b><span id="stripLen">0 / 5000 px</span></span>
  </button>

  <div class="actions">
    <button class="btn" id="btnDiscard">Discard</button>
    <button class="btn filled" id="btnSave">Save</button>
  </div>
</div>

<div id="snack" role="status" aria-live="polite"></div>
<video id="vid" playsinline muted loop autoplay></video>

<script>
(() => {
'use strict';
const DEG = Math.PI/180, TAU = Math.PI*2;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const wrapPi = a => { while(a> Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a; };

/* ── Material Symbols (Sharp), inlined — no CDN, works offline ────── */
const ICON = {
  record:'M480-200q-117 0-198.5-81.5T200-480q0-117 81.5-198.5T480-760q117 0 198.5 81.5T760-480q0 117-81.5 198.5T480-200Z',
  stop:'M240-240v-480h480v480H240Z',
  tune:'M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z',
  download:'M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM160-160v-200h80v120h480v-120h80v200H160Z',
  cameraswitch:'M240-280v-400h120l40-40h160l40 40h120v400H240Zm80-80h320v-240H320v240Zm160-40q33 0 56.5-23.5T560-480q0-33-23.5-56.5T480-560q-33 0-56.5 23.5T400-480q0 33 23.5 56.5T480-400ZM342-940q34-11 68.5-15.5T480-960q94 0 177.5 33.5t148 93Q870-774 911-693.5T960-520h-80q-7-72-38-134.5t-79.5-110Q714-812 651-842t-135-36l62 62-56 56-180-180ZM618-20Q584-9 549.5-4.5T480 0q-94 0-177.5-33.5t-148-93Q90-186 49-266.5T0-440h80q8 72 38.5 134.5t79 110Q246-148 309-118t135 36l-62-62 56-56L618-20ZM480-480Z',
  photo_camera:'M480-260q75 0 127.5-52.5T660-440q0-75-52.5-127.5T480-620q-75 0-127.5 52.5T300-440q0 75 52.5 127.5T480-260Zm0-80q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM80-120v-640h206l74-80h240l74 80h206v640H80Zm80-80h640v-480H638l-73-80H395l-73 80H160v480Zm320-240Z',
  aspect_ratio:'M560-280h200v-200h-80v120H560v80ZM200-480h80v-120h120v-80H200v200ZM80-160v-640h800v640H80Zm80-80h640v-480H160v480Zm0 0v-480 480Z',
  crop_free:'M120-120v-240h80v160h160v80H120Zm480 0v-80h160v-160h80v240H600ZM120-600v-240h240v80H200v160h-80Zm640 0v-160H600v-80h240v240h-80Z',
};
const svg = n => `<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
$('btnFlip').innerHTML   = svg('cameraswitch');
$('btnTune').innerHTML   = svg('tune');
$('btnSource').innerHTML = svg('photo_camera');
$('btnExport').innerHTML = svg('download');
$('icoHD').innerHTML     = svg('aspect_ratio');
$('icoStrip').innerHTML  = svg('crop_free');

/* ── canvases ─────────────────────────────────────────────────────── */
const acc = $('acc'), hud = $('hud'), video = $('vid');
const ax = acc.getContext('2d'), hx = hud.getContext('2d');
const demoCv = document.createElement('canvas'), dx = demoCv.getContext('2d');
// strip keeps its whole history in one wide buffer: no per-frame full-canvas
// blit, and pixels that scroll out of view are no longer destroyed
const CAP = 5000;
let stripCv = null, sxc = null, stripX = 0;

let W = 0, H = 0;                      // accumulation size (viewport aspect)
let state = 'idle';                    // idle | scanning | export

const S = {
  mode:'radial', angle:0, pos:50, slice:2, blades:1,
  cx:.5, cy:.5, snap:'free', reverse:false, guides:true, manual:false,
};
const RATE = { sweep:200, radial:40, strip:20 };   // fixed, per geometry
const src = { el:null, w:0, h:0, kind:null, mirror:false, stream:null, facing:'environment' };

let phi = 0, sweepS = 0, sweepPrev = 0, stripAcc = 0;
let last = 0, glow = 0, glowTarget = 0;            // barrel ghosting

/* ── snackbar ─────────────────────────────────────────────────────── */
let snackT = 0;
function snack(msg, ms = 2600){
  const s = $('snack'); s.textContent = msg; s.classList.add('on');
  clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('on'), ms);
}

/* ── demo source ──────────────────────────────────────────────────── */
demoCv.width = 1280; demoCv.height = 720;
let demoT = 0;
function renderDemo(dt){
  demoT += dt;
  const w = demoCv.width, h = demoCv.height, t = demoT;
  dx.fillStyle = '#14100C'; dx.fillRect(0,0,w,h);
  const bars = ['#FFB868','#EDE0D4','#2EC4FF','#FF5A4E','#8CFF6B'];
  for (let i=0;i<26;i++){
    const x = ((i*96 - t*190) % (w+200) + w+200) % (w+200) - 100;
    dx.fillStyle = bars[i%bars.length]; dx.globalAlpha = .85;
    dx.fillRect(x,0,26,h);
  }
  dx.globalAlpha = 1;
  dx.save(); dx.translate(w/2,h/2); dx.rotate(t*.55);
  for (let i=0;i<12;i++){
    dx.rotate(TAU/12);
    dx.fillStyle = i%2 ? '#14100C' : '#EDE0D4';
    dx.beginPath(); dx.moveTo(0,0); dx.arc(0,0,240,-.13,.13); dx.closePath(); dx.fill();
  }
  dx.restore();
  const bx = w/2 + Math.sin(t*2.1)*(w*.42), by = h/2 + Math.cos(t*3.3)*(h*.36);
  dx.fillStyle = '#FFB868'; dx.beginPath(); dx.arc(bx,by,34,0,TAU); dx.fill();
  dx.fillStyle = '#14100C'; dx.beginPath(); dx.arc(bx,by,14,0,TAU); dx.fill();
}

/* ── sizing: accumulate at the VIEWPORT's aspect ──────────────────────
   Full-bleed with no display crop — what you see is exactly the buffer.
   Only the HD export crops, and the HUD shows that crop.              */
function resize(){
  const vw = innerWidth, vh = innerHeight;
  const s = 1920 / Math.max(vw, vh);
  const nw = Math.round(vw*s), nh = Math.round(vh*s);
  if (nw === W && nh === H) return;
  W = nw; H = nh;
  acc.width = hud.width = W; acc.height = hud.height = H;
  stripCv = null;                                   // re-allocate lazily
  clearAcc();
}
/* Strip is 5000 on its long edge and 1080 on the short one — 5.4 MP.
   Matching the viewport height instead would be 5000x1920 = 9.6 MP / 38 MB,
   which crowds iOS Safari's canvas area ceiling for no visible gain. */
const STRIP_H = 1080;
function ensureStrip(){
  const sh = Math.min(H, STRIP_H);
  if (stripCv && stripCv.height === sh) return;
  try{
    const c = document.createElement('canvas');
    c.width = CAP; c.height = sh;
    const g = c.getContext('2d');
    if (!g) throw new Error('no 2d context');
    g.fillStyle = '#000'; g.fillRect(0,0,CAP,sh);
    // a canvas over the limit allocates but reads back blank — probe it
    g.fillStyle = '#fff'; g.fillRect(CAP-2,0,2,2);
    if (g.getImageData(CAP-1,0,1,1).data[0] < 200) throw new Error('canvas too large');
    stripCv = c; sxc = g; stripX = 0;
    sxc.fillStyle = '#000'; sxc.fillRect(0,0,CAP,sh);
  } catch(e){
    stripCv = null;
    snack('This device can’t allocate a 5000px strip.', 5000);
  }
}
function clearAcc(){
  ax.setTransform(1,0,0,1,0,0);
  ax.fillStyle = '#000'; ax.fillRect(0,0,W,H);
  sweepS = sweepPrev = -sweepLength()/2;
  stripAcc = 0; stripX = 0;
  if (stripCv){ sxc.fillStyle='#000'; sxc.fillRect(0,0,CAP,H); }
}

function drawSource(ctx){
  if (!src.el || !src.w) return;
  const s = Math.max(W/src.w, H/src.h);
  const dw = src.w*s, dh = src.h*s, ox = (W-dw)/2, oy = (H-dh)/2;
  if (src.mirror){
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(src.el, ox, oy, dw, dh); ctx.restore();
  } else ctx.drawImage(src.el, ox, oy, dw, dh);
}

/* ── geometry ─────────────────────────────────────────────────────── */
const dir = () => S.reverse ? -1 : 1;

function stepRadial(dt){
  const a0 = phi;
  if (S.manual) phi += wrapPi(S.angle*DEG - phi);
  else          phi += dir() * RATE.radial * DEG * dt;
  if (state !== 'scanning') return;
  let lo = Math.min(a0,phi), hi = Math.max(a0,phi);
  if (hi-lo > Math.PI){ hi = phi; lo = phi - S.slice*DEG; }
  const minW = Math.max(S.slice,1)*DEG;
  if (hi-lo < minW){ const m=(lo+hi)/2; lo=m-minW/2; hi=m+minW/2; }
  const R = Math.hypot(W,H), px = S.cx*W, py = S.cy*H;
  for (let k=0;k<S.blades;k++){
    const off = k*TAU/S.blades;
    ax.save(); ax.beginPath(); ax.moveTo(px,py);
    ax.arc(px,py,R,lo+off,hi+off); ax.closePath(); ax.clip();
    drawSource(ax); ax.restore();
  }
}

function sweepLength(){
  const th = S.angle*DEG;
  return Math.abs(Math.sin(th))*W + Math.abs(Math.cos(th))*H;
}
function stepSweep(dt){
  const th = S.angle*DEG;
  const nx = -Math.sin(th), ny = Math.cos(th);
  const dxv = Math.cos(th), dyv = Math.sin(th);
  const L = sweepLength();
  sweepPrev = sweepS;
  if (S.manual){
    sweepS = (S.pos/100 - .5)*L;
    if (Math.abs(sweepS-sweepPrev) > L/2) sweepPrev = sweepS;
  } else {
    sweepS += dir() * RATE.sweep * dt;
    if (sweepS >  L/2){ sweepS = -L/2; sweepPrev = -L/2; }
    if (sweepS < -L/2){ sweepS =  L/2; sweepPrev =  L/2; }
  }
  if (state !== 'scanning') return;
  let lo = Math.min(sweepPrev,sweepS), hi = Math.max(sweepPrev,sweepS);
  const minW = Math.max(S.slice,1);
  if (hi-lo < minW){ const m=(lo+hi)/2; lo=m-minW/2; hi=m+minW/2; }
  const D = Math.hypot(W,H), cx = W/2, cy = H/2;
  ax.save(); ax.beginPath();
  ax.moveTo(cx+nx*lo-dxv*D, cy+ny*lo-dyv*D);
  ax.lineTo(cx+nx*lo+dxv*D, cy+ny*lo+dyv*D);
  ax.lineTo(cx+nx*hi+dxv*D, cy+ny*hi+dyv*D);
  ax.lineTo(cx+nx*hi-dxv*D, cy+ny*hi-dyv*D);
  ax.closePath(); ax.clip(); drawSource(ax); ax.restore();
}

/* Strip writes into the wide history buffer, then the viewport shows a
   window onto it. No full-canvas ping-pong, and history survives.     */
function stepStrip(dt){
  if (!S.manual) S.angle = (S.angle + dir()*RATE.strip*dt + 360) % 360;
  if (state !== 'scanning') return;
  ensureStrip();
  if (!stripCv) return;
  stripAcc += Math.max(S.slice,1);
  const adv = Math.floor(stripAcc);
  if (adv < 1) return;
  stripAcc -= adv;

  if (stripX + adv >= CAP){ onCapReached(); return; }

  const SH = stripCv.height, k = SH/H;   // strip is a scaled copy of the buffer
  const th = S.angle*DEG;
  sxc.save();
  sxc.beginPath(); sxc.rect(stripX, 0, adv, SH); sxc.clip();
  sxc.translate(stripX + adv/2, SH/2);
  sxc.scale(k, k);
  sxc.rotate(Math.PI/2 - th);
  sxc.translate(-S.cx*W, -S.cy*H);
  drawSource(sxc);
  sxc.restore();
  stripX += adv;
}
function presentStrip(){
  if (!stripCv || !stripX) return;
  const SH = stripCv.height, k = SH/H;
  const winW = Math.min(stripX, W*k);            // visible window, in strip px
  const from = Math.max(0, stripX - winW);
  ax.setTransform(1,0,0,1,0,0);
  ax.fillStyle = '#000'; ax.fillRect(0,0,W,H);
  ax.drawImage(stripCv, from, 0, winW, SH, 0, 0, winW/k, H);
}
function onCapReached(){
  snack('Strip reached 5000 px — scan stopped.', 4000);
  setState('export');
}

/* ── HUD: the barrel. Ghosts when untouched, blooms under the thumb ── */
function drawHud(){
  hx.setTransform(1,0,0,1,0,0);
  hx.clearRect(0,0,W,H);
  if (!S.guides || !src.el) return;

  const u = Math.max(1, Math.min(W,H)/420);
  const a = .16 + .84*glow;                 // ghosted → bloomed
  hx.lineWidth = 1.5*u;
  hx.font = `${11*u}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;
  hx.textAlign = 'center'; hx.textBaseline = 'middle';

  // HD export frame: what the 1920x1080 still will actually keep
  if (state !== 'idle'){
    const fh = Math.min(H, W*9/16), fw = Math.min(W, H*16/9);
    hx.strokeStyle = `rgba(213,198,180,${.28*a})`;
    hx.setLineDash([6*u,6*u]);
    hx.strokeRect((W-fw)/2, (H-fh)/2, fw, fh);
    hx.setLineDash([]);
  }

  if (S.mode === 'radial'){
    const px = S.cx*W, py = S.cy*H, R = Math.min(W,H)*.34;
    hx.strokeStyle = `rgba(237,224,212,${.30*a})`;
    hx.beginPath(); hx.arc(px,py,R,0,TAU); hx.stroke();
    for (let d=0; d<360; d+=15){
      const long = d%45===0, r = long ? R-13*u : R-6*u;
      const c = Math.cos(d*DEG), s = Math.sin(d*DEG);
      hx.strokeStyle = `rgba(237,224,212,${(long?.62:.24)*a})`;
      hx.beginPath(); hx.moveTo(px+c*R,py+s*R); hx.lineTo(px+c*r,py+s*r); hx.stroke();
    }
    hx.fillStyle = `rgba(237,224,212,${.55*a})`;
    for (let d=0; d<360; d+=90)
      hx.fillText(String(d).padStart(3,'0'), px+Math.cos(d*DEG)*(R-27*u), py+Math.sin(d*DEG)*(R-27*u));
    const D = Math.hypot(W,H);
    for (let k=0;k<S.blades;k++){
      const ang = phi + k*TAU/S.blades;
      hx.strokeStyle = `rgba(255,184,104,${(k?.34:.95)*Math.max(a,.55)})`;
      hx.beginPath(); hx.moveTo(px,py); hx.lineTo(px+Math.cos(ang)*D, py+Math.sin(ang)*D); hx.stroke();
    }
    hx.strokeStyle = `rgba(255,184,104,${.9*Math.max(a,.5)})`;
    hx.beginPath(); hx.arc(px,py,7*u,0,TAU); hx.stroke();

  } else if (S.mode === 'sweep'){
    const th = S.angle*DEG, nx=-Math.sin(th), ny=Math.cos(th);
    const dxv=Math.cos(th), dyv=Math.sin(th), D=Math.hypot(W,H);
    const cx=W/2, cy=H/2, bx=cx+nx*sweepS, by=cy+ny*sweepS, L=sweepLength();
    hx.strokeStyle = `rgba(237,224,212,${.20*a})`;
    hx.beginPath(); hx.moveTo(cx-nx*L/2,cy-ny*L/2); hx.lineTo(cx+nx*L/2,cy+ny*L/2); hx.stroke();
    hx.strokeStyle = `rgba(255,184,104,${.95*Math.max(a,.55)})`;
    hx.beginPath(); hx.moveTo(bx-dxv*D,by-dyv*D); hx.lineTo(bx+dxv*D,by+dyv*D); hx.stroke();

  } else {
    const th = S.angle*DEG, D = Math.hypot(W,H), px = S.cx*W, py = S.cy*H;
    hx.strokeStyle = `rgba(255,184,104,${.95*Math.max(a,.55)})`;
    hx.beginPath();
    hx.moveTo(px-Math.cos(th)*D, py-Math.sin(th)*D);
    hx.lineTo(px+Math.cos(th)*D, py+Math.sin(th)*D); hx.stroke();
  }
}

/* ── loop ─────────────────────────────────────────────────────────── */
function frame(dt){
  if (src.kind === 'demo') renderDemo(dt);
  if (!src.el || !W) return;

  glow += (glowTarget - glow) * Math.min(1, dt*8);

  if (state === 'idle'){
    ax.setTransform(1,0,0,1,0,0);
    drawSource(ax);                       // live preview, nothing accumulating
    if (S.mode === 'radial') stepRadial(dt);
    else if (S.mode === 'sweep') stepSweep(dt);
    else stepStrip(dt);
  } else {
    if (S.mode === 'radial') stepRadial(dt);
    else if (S.mode === 'sweep') stepSweep(dt);
    else { stepStrip(dt); if (state === 'scanning') presentStrip(); }
  }
  drawHud();
  syncReadout();
}
function tick(now){
  requestAnimationFrame(tick);
  const dt = last ? Math.min((now-last)/1000, .1) : 0;
  last = now;
  frame(dt);
}

function syncReadout(){
  const aDeg = S.mode === 'radial' ? ((phi/DEG%360)+360)%360 : S.angle;
  $('rAngle').textContent = aDeg.toFixed(0).padStart(3,'0') + '°';
  $('readout').firstChild.nodeValue = S.mode.toUpperCase() + ' · ';
  if (!S.manual) { $('sAngle').value = aDeg; $('oAngle').textContent = aDeg.toFixed(0)+'°'; }
}

/* ── state machine ────────────────────────────────────────────────── */
function setState(next){
  state = next;
  const sh = $('shutter');
  if (next !== 'export') closeSheets();   // never leave a stale sheet over a live scan
  if (next === 'idle'){
    sh.innerHTML = svg('record'); sh.classList.remove('recording');
    sh.setAttribute('aria-label','Start scan');
    $('btnExport').disabled = true;
    clearAcc();
  } else if (next === 'scanning'){
    sh.innerHTML = svg('stop'); sh.classList.add('recording');
    sh.setAttribute('aria-label','Stop scan');
    $('btnExport').disabled = true;
    clearAcc();
  } else {
    sh.innerHTML = svg('record'); sh.classList.remove('recording');
    sh.setAttribute('aria-label','New scan');
    $('btnExport').disabled = false;
    if (S.mode === 'strip') presentStrip();
    openExport();
  }
}

/* ── export ───────────────────────────────────────────────────────── */
function exportCanvas(kind){
  if (kind === 'strip' && S.mode === 'strip' && stripCv && stripX > 0){
    const c = document.createElement('canvas');
    c.width = Math.min(stripX, CAP); c.height = stripCv.height;
    c.getContext('2d').drawImage(stripCv, 0,0, c.width,c.height, 0,0, c.width,c.height);
    return c;
  }
  // HD: centre-crop the buffer to 16:9, then scale to 1920x1080
  const c = document.createElement('canvas');
  c.width = 1920; c.height = 1080;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0,0,1920,1080);
  const useStrip = S.mode === 'strip' && stripCv && stripX > 0;
  const source = useStrip ? stripCv : acc;
  const sw0 = useStrip ? Math.min(stripX,CAP) : W;
  const sh0 = useStrip ? stripCv.height : H;
  const s = Math.max(1920/sw0, 1080/sh0);
  const dw = sw0*s, dh = sh0*s;
  g.drawImage(source, 0,0, sw0,sh0, (1920-dw)/2, (1080-dh)/2, dw, dh);
  return c;
}
let exportKind = 'hd';
function openExport(){
  const strippable = S.mode === 'strip' && stripX > 0;
  $('optStrip').hidden = !strippable;
  $('stripLen').textContent = `${stripX} / ${CAP} px`;
  $('exportHint').textContent = strippable
    ? `Strip is ${stripX} px long.`
    : `Scan is ${W} × ${H}.`;
  exportKind = 'hd';
  openSheet('sheetExport');
}
$('optHD').addEventListener('click', () => { exportKind='hd'; doSave(); });
$('optStrip').addEventListener('click', () => { exportKind='strip'; doSave(); });
$('btnSave').addEventListener('click', doSave);
$('btnDiscard').addEventListener('click', () => { closeSheets(); setState('idle'); });

function doSave(){
  const c = exportCanvas(exportKind);
  c.toBlob(async blob => {
    if (!blob) return snack('Nothing to save.');
    const file = new File([blob], `slitscan-${c.width}x${c.height}.png`, {type:'image/png'});
    try{
      if (navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        closeSheets(); return;
      }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    snack(`Saved ${c.width}×${c.height}`);
    closeSheets();
  }, 'image/png');
}

/* ── sheets ───────────────────────────────────────────────────────── */
function openSheet(id){
  closeSheets();
  $(id).classList.add('on'); $('scrim').classList.add('on');
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  $('scrim').classList.remove('on');
}
$('scrim').addEventListener('click', closeSheets);
$('btnTune').addEventListener('click', () => openSheet('sheetTune'));
$('tuneDone').addEventListener('click', closeSheets);
$('btnExport').addEventListener('click', openExport);
$('btnAdvanced').addEventListener('click', e => {
  const open = $('advanced').hidden;
  $('advanced').hidden = !open;
  e.currentTarget.setAttribute('aria-expanded', String(open));
});

/* ── controls ─────────────────────────────────────────────────────── */
const press = (g, attr, val) =>
  [...g.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val))));

$('shutter').addEventListener('click', () => {
  if (state === 'scanning') setState('export');
  else setState('scanning');
});

$('segMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.mode = b.dataset.mode; applyMode();
});
$('segBlades').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.blades = +b.dataset.blades; press($('segBlades'),'blades',S.blades); clearAcc();
});
$('segSlice').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setSlice(+b.dataset.slice);
});
$('sSlice').addEventListener('input', e => setSlice(+e.target.value, true));
function setSlice(v, fromFine){
  S.slice = clamp(Math.round(v), 1, 60);
  press($('segSlice'),'slice',S.slice);
  $('sSlice').value = S.slice;
  $('oSlice').textContent = S.mode === 'radial' ? S.slice+'°' : S.slice+' px';
  $('oSliceFine').textContent = S.slice;
}
$('chipsSnap').addEventListener('click', e => {
  const b = e.target.closest('button[data-snap]'); if (!b) return;
  S.snap = b.dataset.snap;
  [...$('chipsSnap').querySelectorAll('[data-snap]')]
    .forEach(c => c.setAttribute('aria-pressed', String(c.dataset.snap === S.snap)));
  if (S.snap !== 'free'){
    S.angle = +S.snap; S.manual = true; phi = S.angle*DEG;
    $('sAngle').value = S.angle; $('oAngle').textContent = S.angle+'°';
  } else S.manual = false;
});
$('chipReverse').addEventListener('click', e => {
  S.reverse = !S.reverse;
  e.currentTarget.setAttribute('aria-pressed', String(S.reverse));
  snack(S.reverse ? 'Reversed' : 'Forward', 1200);
});
$('sAngle').addEventListener('input', e => {
  S.angle = +e.target.value; S.manual = true;
  if (S.mode === 'radial') phi = S.angle*DEG;
  $('oAngle').textContent = S.angle+'°';
});
$('segGuides').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.guides = b.dataset.guides === 'on'; press($('segGuides'),'guides',b.dataset.guides);
});
$('btnRecentre').addEventListener('click', () => { S.cx = S.cy = .5; snack('Pivot centred',1200); });

function applyMode(){
  press($('segMode'),'mode',S.mode);
  press($('segBlades'),'blades',S.blades);
  $('grpBlades').hidden = S.mode !== 'radial';
  $('lSlice').textContent = S.mode==='sweep' ? 'Slit' : S.mode==='radial' ? 'Blade' : 'Rate';
  $('sSlice').max = S.mode==='sweep' ? 60 : S.mode==='radial' ? 20 : 12;
  setSlice(clamp(S.slice, 1, +$('sSlice').max));
  clearAcc();
}

/* ── direct manipulation ──────────────────────────────────────────── */
const vp = $('viewport');
let dragging = null;

function toCanvas(ev){
  const r = acc.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width*W, y:(ev.clientY-r.top)/r.height*H };
}
vp.addEventListener('pointerdown', ev => {
  if (!src.el || !W) return;
  vp.setPointerCapture(ev.pointerId);
  const p = toCanvas(ev), u = Math.max(1, Math.min(W,H)/420);
  dragging = (S.mode !== 'sweep' && Math.hypot(p.x-S.cx*W, p.y-S.cy*H) < 26*u)
    ? 'pivot' : 'aim';
  glowTarget = 1;
  if (dragging === 'aim') S.manual = true;
  onDrag(ev);
});
vp.addEventListener('pointermove', ev => { if (dragging) onDrag(ev); });
['pointerup','pointercancel'].forEach(t => vp.addEventListener(t, () => {
  dragging = null; glowTarget = 0;
  if (S.snap === 'free') S.manual = false;      // springs back to auto
}));

function onDrag(ev){
  const p = toCanvas(ev);
  if (dragging === 'pivot'){
    S.cx = clamp(p.x/W,0,1); S.cy = clamp(p.y/H,0,1); return;
  }
  if (S.mode === 'sweep'){
    const th = S.angle*DEG, nx=-Math.sin(th), ny=Math.cos(th), L=sweepLength();
    S.pos = clamp((((p.x-W/2)*nx + (p.y-H/2)*ny)/L + .5)*100, 0, 100);
  } else {
    let d = (Math.atan2(p.y-S.cy*H, p.x-S.cx*W)/DEG + 360) % 360;
    for (const t of [0,45,90,135,180,225,270,315,360])   // visual detents
      if (Math.abs(d-t) < 4) d = t % 360;
    S.angle = d;
    if (S.mode === 'radial') phi = d*DEG;
    $('sAngle').value = d; $('oAngle').textContent = d.toFixed(0)+'°';
  }
}

/* ── sources ──────────────────────────────────────────────────────── */
function stopStream(){ if (src.stream){ src.stream.getTracks().forEach(t=>t.stop()); src.stream=null; } }
function waitForFrames(ms = 8000){
  return new Promise((res,rej) => {
    const t0 = performance.now();
    (function c(){
      if (video.videoWidth>0 && video.videoHeight>0) return res();
      if (performance.now()-t0 > ms) return rej(new Error('NoFrames'));
      requestAnimationFrame(c);
    })();
  });
}
function useDemo(){
  stopStream(); video.srcObject=null; video.removeAttribute('src'); video.load?.();
  src.el = demoCv; src.w = demoCv.width; src.h = demoCv.height;
  src.kind = 'demo'; src.mirror = false;
  resize(); clearAcc();
}
async function useCamera(facing){
  if (!navigator.mediaDevices?.getUserMedia)
    return snack(isSecureContext ? 'No camera API in this browser.'
                                 : 'Camera needs https.', 5000);
  try{
    stopStream(); snack('Starting camera…', 8000);
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
    src.stream = stream; src.facing = facing;
    video.removeAttribute('src'); video.srcObject = stream;
    await video.play().catch(()=>{});
    await waitForFrames();
    src.el = video; src.w = video.videoWidth; src.h = video.videoHeight;
    src.kind = 'camera'; src.mirror = (facing === 'user');
    resize(); clearAcc();
    snack(`${facing==='user'?'Front':'Rear'} camera · ${src.w}×${src.h}`, 1600);
  } catch(e){
    stopStream();
    const n = e && e.name;
    snack(n==='NotAllowedError' ? 'Camera blocked. Safari ▸ aA ▸ Website Settings ▸ Camera ▸ Allow.'
        : n==='NotFoundError'   ? 'No camera on this device.'
        : n==='NotReadableError'? 'Camera busy — close other apps.'
        : e && e.message==='NoFrames' ? 'Camera sent no frames. Reload and retry.'
        : 'Couldn’t open camera: '+(n||'unknown'), 5000);
  }
}
$('btnFlip').addEventListener('click', () =>
  useCamera(src.facing === 'user' ? 'environment' : 'user'));
$('btnSource').addEventListener('click', () => {
  const cam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const note = cam ? '' : ' · needs https';
  chooseSource([
    ['Rear camera'+note,  () => useCamera('environment')],
    ['Front camera'+note, () => useCamera('user')],
    ['Demo source',       () => useDemo()],
  ]);
});
function chooseSource(opts){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))';
  for (const [label, run] of opts){
    const b = document.createElement('button');
    b.className='btn filled'; b.textContent=label;
    b.style.cssText='min-height:56px';
    b.onclick = () => { wrap.remove(); run(); };    // sync: keeps the gesture
    wrap.appendChild(b);
  }
  const c = document.createElement('button');
  c.className='btn'; c.textContent='Cancel'; c.style.cssText='min-height:56px;background:var(--s-container)';
  c.onclick = () => wrap.remove();
  wrap.appendChild(c);
  document.body.appendChild(wrap);
}

/* ── boot ─────────────────────────────────────────────────────────── */
addEventListener('resize', () => { resize(); });
document.addEventListener('visibilitychange', () => { last = 0; });
applyMode(); setState('idle'); useDemo();
requestAnimationFrame(tick);

window.__slit2 = {
  S, acc, hud, src, get state(){return state}, setState, resize, clearAcc,
  useDemo, useCamera, applyMode, exportCanvas,
  get stripX(){return stripX}, get W(){return W}, get H(){return H},
  burn(n, dt=1/60){ for(let i=0;i<n;i++) frame(dt); },
};
})();
</script>
</body>
</html>
